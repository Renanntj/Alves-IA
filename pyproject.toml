[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alves-ia"
version = "0.1.0"
description = "Base de API FastAPI para projetos de IA e automações."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4,<6",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "APScheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.28,<1",
    "openai>=1.70,<2",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=25,<26",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

