# Isolated disposable PostgreSQL. These credentials are exclusively for tests.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: alves_test
      POSTGRES_USER: alves_owner
      POSTGRES_PASSWORD: test-owner-only
      APP_DB_PASSWORD: test-app-only
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro,z
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U alves_owner -d alves_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      target: runtime
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://alves_owner:test-owner-only@db/alves_test
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_OWNER_DATABASE_URL: postgresql+psycopg://alves_owner:test-owner-only@db/alves_test
      TEST_DATABASE_URL: postgresql+psycopg://alves_app:test-app-only@db/alves_test
      JWT_SECRET: test-signing-key-not-for-production-123456789
    depends_on:
      migrate:
        condition: service_completed_successfully
