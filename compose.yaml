services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: alves
      POSTGRES_USER: alves_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro,z
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U alves_owner -d alves"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Configure MIGRATION_DATABASE_URL}
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      APP_NAME: Alves-IA
      DEBUG: "false"
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_SHEETS_ENCRYPTION_KEY: ${GOOGLE_SHEETS_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_LIVE_ENABLED: ${AI_LIVE_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_SHEETS_ENCRYPTION_KEY: ${GOOGLE_SHEETS_ENCRYPTION_KEY:-}
    command: [celery, -A, alves_ia.whatsapp.tasks:app, worker, --loglevel=INFO]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  beat:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
    command: [celery, -A, alves_ia.whatsapp.tasks:app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat]
    depends_on:
      redis:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
